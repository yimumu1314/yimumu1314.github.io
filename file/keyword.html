<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>关键词提示系统</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 2em;
      background-color: #f8f9fa;
    }
    input, button {
      padding: 0.5em;
      font-size: 1em;
      margin: 0.5em 0;
    }
    #result {
      margin-top: 1em;
      padding: 1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>请输入关键词</h2>
  <input type="text" id="keywordInput" placeholder="输入关键词...">
  <button onclick="checkKeyword()">查询</button>

  <div id="result">👉 请输入关键词查看提示信息</div>

  <script>
    const keywordMap = {
      "签证": "签证信息：请访问中国驻外使馆官网获取最新签证指南。",
      "毕业": "毕业条件：需修满全部学分，并完成论文答辩。",
      "Obsidian": "Obsidian 是一款支持 Markdown 的双链笔记工具，适合知识管理。",
      "Latex": "LaTeX 是用于科学排版的排版系统，适合论文与公式编辑。",
      // 你可以在这里添加更多关键词和对应内容
    };

    function checkKeyword() {
      const input = document.getElementById("keywordInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (keywordMap[input]) {
        resultDiv.textContent = keywordMap[input];
      } else {
        resultDiv.textContent = "未找到相关信息，请检查关键词是否正确。";
      }
    }
  </script>

</body>
</html>
